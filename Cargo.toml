[package]
name = "flashseek"
version = "0.1.0"
edition = "2021"
description = "Windows instant file search: Everything-class names plus selected-folder content"
license = "MIT"
publish = false

[lib]
name = "flashseek"
path = "src/lib.rs"

[[bin]]
name = "flashseek-cli"
path = "src/bin/flashseek-cli.rs"

[[bin]]
name = "flashseek"
path = "src/bin/flashseek.rs"
required-features = ["ui"]

[features]
default = []
ui = ["dep:eframe"]

[dependencies]
eframe = { version = "0.32", optional = true }
filetime = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
